appId: com.nebuwork.nebushell
productName: NebuShell
directories:
  buildResources: build
  output: dist-win7
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - resources/**
asarUnpack:
  - resources/**
  # 远程桌面输入注入用的 nut.js 原生模块(.node 二进制不能打进 asar)。
  - node_modules/@nut-tree-fork/**
  # 远程命令行用的 node-pty 原生模块(ConPTY / pty.node 二进制)。
  - node_modules/node-pty/**
win:
  executableName: NebuShell
  target:
    - target: nsis
      arch: [x64]
nsis:
  artifactName: ${productName}-${version}-win7-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${productName}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${productName}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
